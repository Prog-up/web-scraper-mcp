# Plain free CLIs as jobs — works on any GitLab (incl. self-managed EPITA),
# no Ultimate license required. Stages: quality gate -> security -> build ->
# (manual) benchmark scorecard.
stages: [lint, test, security, build, benchmark]

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  TAG: $CI_COMMIT_SHORT_SHA

# --- reusable uv job (Python 3.13, frozen lockfile) ---------------------------
.uv:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --frozen

# === quality gate =============================================================
ruff:
  stage: lint
  extends: .uv
  script:
    - uv run ruff check .
    - uv run ruff format --check .

mypy:
  stage: lint
  extends: .uv
  script:
    - uv run mypy src

pytest:
  stage: test
  extends: .uv
  script:
    - uv run pytest -q

# === security =================================================================
bandit:          # Python SAST — blocking
  stage: security
  extends: .uv
  script:
    - uv run bandit -r src -ll

secret-detection:  # blocking — no secrets should ever land in the repo
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --no-banner -v

dependency-scan:   # dep CVEs against the lockfile — report only (transitive CVEs
  stage: security  # are often unfixable; don't block the pipeline on them)
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL uv.lock
  allow_failure: true

# === build & push =============================================================
build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$TAG"
    - docker push "$IMAGE:latest"
    # Capture the immutable digest so downstream jobs sign/scan by digest.
    - DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG")
    - echo "IMAGE_DIGEST=$DIGEST" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# === benchmark scorecard (manual: slow, downloads datasets) ===================
benchmark:
  stage: benchmark
  extends: .uv
  when: manual
  script:
    - uv run python benchmarks/run.py --output scorecard.md
  artifacts:
    paths: [scorecard.md, benchmarks/scorecard.json]

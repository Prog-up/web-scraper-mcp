# Plain free CLIs as jobs — works on any GitLab (incl. self-managed EPITA),
# no Ultimate license required. Stages: quality gate -> security -> build ->
# scan/sign the image -> (manual) benchmark scorecard.
stages: [lint, test, security, build, sign, benchmark]

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  TAG: $CI_COMMIT_SHORT_SHA

# --- reusable uv job (Python 3.13, frozen lockfile) ---------------------------
.uv:
  image: ghcr.io/astral-sh/uv:0.11-python3.13-bookworm-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --frozen

# === quality gate =============================================================
ruff:
  stage: lint
  extends: .uv
  script:
    - uv run ruff check .
    - uv run ruff format --check .

mypy:
  stage: lint
  extends: .uv
  script:
    - uv run mypy src

pytest:
  stage: test
  extends: .uv
  script:
    - uv run pytest -q

# === security =================================================================
bandit:          # Python SAST — blocking
  stage: security
  extends: .uv
  script:
    - uv run bandit -r src -ll

secret-detection:  # blocking — no secrets should ever land in the repo
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --no-banner -v

dependency-scan:   # dep CVEs against the lockfile — report only (transitive CVEs
  stage: security  # are often unfixable; don't block the pipeline on them)
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL uv.lock
  allow_failure: true

# === build & push =============================================================
build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$TAG"
    - docker push "$IMAGE:latest"
    # Capture the immutable digest so downstream jobs sign/scan by digest.
    - DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG")
    - echo "IMAGE_DIGEST=$DIGEST" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# === scan & sign the built image =============================================
container-scan:    # image CVEs — report only
  stage: sign
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - trivy image --severity HIGH,CRITICAL "$IMAGE_DIGEST"
  allow_failure: true

sbom:              # software bill of materials -> artifact
  stage: sign
  image:
    name: anchore/syft:latest
    entrypoint: [""]
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_BRANCH
  variables:
    SYFT_REGISTRY_AUTH_USERNAME: "$CI_REGISTRY_USER"
    SYFT_REGISTRY_AUTH_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - syft "registry:$IMAGE_DIGEST" -o spdx-json=sbom.spdx.json
  artifacts:
    paths: [sbom.spdx.json]

sign:              # keyless image signature + SBOM attestation (Sigstore)
  stage: sign
  image:
    name: gcr.io/projectsigstore/cosign:v2.4.1
    entrypoint: [""]
  needs: ["build", "sbom"]
  rules:
    - if: $CI_COMMIT_BRANCH
  # GitLab OIDC token consumed by cosign for keyless signing (aud=sigstore).
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - cosign sign --yes "$IMAGE_DIGEST"
    - cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE_DIGEST"

# === benchmark scorecard (manual: slow, downloads datasets) ===================
benchmark:
  stage: benchmark
  extends: .uv
  when: manual
  script:
    - uv run python benchmarks/run.py --output scorecard.md
  artifacts:
    paths: [scorecard.md, benchmarks/scorecard.json]

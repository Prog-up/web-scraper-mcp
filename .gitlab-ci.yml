# GitLab validates the same artifact. The canonical signed release is on GitHub/Docker Hub.
stages: [lint, test, security, build, image-scan, benchmark]
.uv:
  image: python:3.12-slim-trixie@sha256:02108f5d322dd89f1c9e552442c25acb0543dfdbc455693a5599624f20d9155d
  before_script:
    - pip install uv==0.12.21
    - uv sync --frozen
ruff:
  stage: lint
  extends: .uv
  script:
    - uv run ruff check src tests benchmarks scripts
    - uv run ruff format --check src tests benchmarks scripts
mypy:
  stage: lint
  extends: .uv
  script: [uv run mypy src]
pytest:
  stage: test
  extends: .uv
  script: [uv run pytest -q]
bandit:
  stage: security
  extends: .uv
  script: [uv run bandit -r src -ll]
secret-detection:
  stage: security
  image:
    name: zricethezav/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0'
  script: [gitleaks detect --source . --redact --no-banner]
dependency-scan:
  stage: security
  extends: .uv
  script: [python scripts/audit_dependencies.py]
build:
  stage: build
  image: library/docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - name: library/docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      alias: docker
      command: [dockerd]
  variables:
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
  script:
    - docker build -t web-scraper-mcp:validated .
    - >-
      for fixture in scripts/browser_regression.py scripts/browser_features.py; do
      docker run --rm -i --init --network none --read-only
      --tmpfs /tmp:size=256m --shm-size=256m --memory=1536m --cpus=2 --pids-limit=256
      --cap-drop ALL --cap-add SYS_CHROOT --security-opt seccomp=deploy/chromium-seccomp.json
      --security-opt no-new-privileges:true
      web-scraper-mcp:validated python - < "$fixture" || exit $?; done
    - docker save web-scraper-mcp:validated -o image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 day
image-scan:
  stage: image-scan
  image:
    name: aquasec/trivy:latest@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint: ['']
  needs: [build]
  script:
    - trivy image --input image.tar --exit-code 1 --severity HIGH,CRITICAL
benchmark:
  stage: benchmark
  extends: .uv
  when: manual
  script: [uv run python benchmarks/run.py --output scorecard.md]
  artifacts:
    paths: [scorecard.md, benchmarks/scorecard.json]

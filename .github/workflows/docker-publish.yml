name: Validate and publish image
on:
  push:
    tags: ['v*.*.*', '*.*.*']
permissions:
  contents: read
concurrency:
  group: docker-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag, package version and default-branch revision
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse "origin/$DEFAULT_BRANCH")"
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v?\d+\.\d+\.\d+", tag):
              raise SystemExit("Release tag must be a stable semantic version")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag.removeprefix("v") != version:
              raise SystemExit("Release tag must match the package version")
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/web-scraper-mcp
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Build artifact before publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: web-scraper-mcp:validated
      - name: Test exact sandboxed browser and proxy artifact
        run: |
          set -euo pipefail
          for fixture in scripts/browser_regression.py scripts/browser_features.py; do
            docker run --rm -i --init --network none --read-only \
              --tmpfs /tmp:size=256m --shm-size=256m --memory=1536m --cpus=2 --pids-limit=256 \
              --cap-drop ALL --cap-add SYS_CHROOT \
              --security-opt no-new-privileges:true \
              --security-opt seccomp=deploy/chromium-seccomp.json \
              web-scraper-mcp:validated python - < "$fixture"
          done
      - name: Record all HIGH/CRITICAL findings before the publication gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: web-scraper-mcp:validated
          scanners: vuln
          format: json
          output: trivy-full.json
          exit-code: '0'
          ignore-unfixed: false
          severity: HIGH,CRITICAL
      - name: Retain complete vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-release-${{ github.ref_name }}
          path: trivy-full.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce the approved release inventory and expiry
        env:
          RELEASE: ${{ github.ref_name }}
        run: python scripts/check_image_release.py trivy-full.json --release "$RELEASE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the already scanned artifact
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/web-scraper-mcp
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag web-scraper-mcp:validated "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' web-scraper-mcp:validated)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published $DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate SPDX inventory from the same artifact
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: web-scraper-mcp:validated
          scanners: vuln
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '0'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign, attest, and verify the published digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/docker-publish.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$DIGEST"
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity "$IDENTITY" "$DIGEST"
          cosign verify-attestation --type spdxjson --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity "$IDENTITY" "$DIGEST"

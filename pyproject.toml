[project]
name = "web-scraper-mcp"
version = "1.1.0"
description = "Self-hosted MCP tools for bounded web scraping, search and extraction"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["mcp", "web-scraping", "ollama", "playwright"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=3.4.2,<5",
    "httpx>=0.28,<1",
    "httpcore>=1.0.9,<2",
    "h11>=0.16,<1",
    "jsonschema>=4.23,<5",
    "anyio>=4.14.2",
    "h2>=4.4.1",
    "pyjwt>=2.15.0",
    "urllib3>=2.8.0",
    "playwright>=1.63,<2",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "tenacity>=9.0",
    "anthropic>=0.40",
    "ddgs>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "playwright-stealth>=2.0.3",
]

[project.scripts]
web-scraper-mcp = "web_scraper_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Prog-up/web-scraper-mcp"
Repository = "https://github.com/Prog-up/web-scraper-mcp"
Issues = "https://github.com/Prog-up/web-scraper-mcp/issues"
Changelog = "https://github.com/Prog-up/web-scraper-mcp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "bandit>=1.7",
    "pre-commit>=4.6.0",
    "virtualenv>=21.7.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_scraper_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/benchmarks/*.py",
    "/benchmarks/README.md",
    "/docs",
    "/deploy",
    "/.github",
    "/.gitignore",
    "/.dockerignore",
    "/.env.example",
    "/.python-version",
    "/.pre-commit-config.yaml",
    "/.gitlab-ci.yml",
    "/Dockerfile",
    "/compose.yaml",
    "/start.sh",
    "/README.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101 (assert) is fine in tests; allow in benchmarks too.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"benchmarks/*" = ["S101"]
"scripts/browser_regression.py" = ["S101"]
"scripts/browser_features.py" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

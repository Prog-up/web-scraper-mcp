[project]
name = "web-scraper-mcp"
version = "0.1.0"
description = "Self-hosted web scraper MCP server with paid-tier tool parity"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
    "playwright>=1.45",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "tenacity>=9.0",
    "anthropic>=0.40",
    "ddgs>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "playwright-stealth>=2.0.3",
]

[project.scripts]
web-scraper-mcp = "web_scraper_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "bandit>=1.7",
    "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_scraper_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101 (assert) is fine in tests; allow in benchmarks too.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"benchmarks/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
